appId: com.info.servermanager
productName: Server Manager
directories:
  buildResources: build
  output: release
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.ts'
  - '!{tsconfig,tsconfig.node,tsconfig.web}.json'
  - '!tailwind.config.js'
  - '!postcss.config.js'
asarUnpack:
  - '**/*.{node,dll}'
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
